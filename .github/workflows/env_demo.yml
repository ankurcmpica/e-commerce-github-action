name: Show Env variable

on: 
  workflow_dispatch:
    inputs:
      environments:
        description: Select the environment you want
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prd

env:
  NAME: ankur
jobs:
  show_env:
    runs-on: ubuntu-latest
    steps:
      - name: Show plaintext env
        run: echo "My name is ${{env.NAME}}"
      - name: Show Secrets
        run: echo "One fun secrets is ${{ secrets.ANKUR_SECRET }}"
      - name: Show Variavles
        run: echo "MY Dockerhub Username is ${{ vars.DOCKERHUB_USERNAME }}"
      - name: Show the input env
        run: echo "The selected env is ${{ inputs.environments }}"
